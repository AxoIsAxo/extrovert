services:
  extrovert:
    image: axoisaxo/extrovert:latest
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - nginx-proxy-manager_default
    volumes:
      - extrovert_data:/app/data
      - extrovert_uploads:/app/uploads
    environment:
      - NODE_ENV=production

volumes:
  extrovert_data:
  extrovert_uploads:

networks:
  nginx-proxy-manager_default:
    external: true
